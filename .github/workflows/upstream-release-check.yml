name: Check upstream stable release

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

concurrency:
  group: upstream-stable-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  propose-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Find latest stable tag
        id: release
        shell: bash
        run: |
          latest="$({
            git ls-remote --tags --refs https://github.com/frappe/lms.git 'v*' \
              | awk '{sub("refs/tags/", "", $2); print $2}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V
          } | tail -n 1)"
          current="$(tr -d '[:space:]' < .upstream-version)"
          test -n "$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "upgrade=false" >> "$GITHUB_OUTPUT"
          else
            echo "upgrade=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge release into upgrade branch
        if: steps.release.outputs.upgrade == 'true'
        id: merge
        continue-on-error: true
        shell: bash
        env:
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          branch="upgrade/frappe-${LATEST}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add frappe-upstream https://github.com/frappe/lms.git
          git fetch frappe-upstream "refs/tags/${LATEST}:refs/tags/${LATEST}"
          git switch -c "$branch"
          git merge --no-edit "$LATEST"
          printf '%s\n' "$LATEST" > .upstream-version
          git add .upstream-version
          git commit -m "chore: track Frappe Learning ${LATEST}"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open upgrade pull request
        if: steps.release.outputs.upgrade == 'true' && steps.merge.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release.outputs.latest }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          existing="$(gh pr list --base staging --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$existing" ]; then
            echo "Upgrade pull request already open: $existing"
          else
            gh pr create \
              --base staging \
              --head "$BRANCH" \
              --title "Upgrade Frappe Learning to ${LATEST}" \
              --body "Automated stable-release merge. Review migrations, run the staging suite, deploy the immutable staging image, and complete smoke testing before promoting the same image digest to production."
          fi

      - name: Report merge conflict
        if: steps.release.outputs.upgrade == 'true' && steps.merge.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          title="Manual merge required for Frappe Learning ${LATEST}"
          existing="$(gh issue list --state open --search "${title} in:title" --json url --jq '.[0].url')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "$title" \
              --body "The scheduled stable-release merge into staging conflicted. Create an upgrade branch from staging, merge tag ${LATEST}, resolve conflicts locally, and open a pull request. Production was not changed."
          fi
          exit 1
